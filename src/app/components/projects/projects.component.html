<section id="projects" class="projects-section">
  <div class="container">
    <div class="section-header reveal">
      <span class="label-tag">Our Work</span>
      <h2 class="section-title">Featured <em>Projects</em></h2>
      <p class="section-sub">A selection of completed work across energy, ICT, and security sectors.</p>
    </div>

    <div class="projects-grid">
      <div
        class="project-card reveal"
        *ngFor="let p of projects; let i = index"
        [style.--delay]="(i * 0.08) + 's'"
      >
        <div class="project-thumb" [style.background]="p.color">
          <span class="thumb-icon">{{ p.icon }}</span>
        </div>
        <div class="project-info">
          <span class="project-cat">{{ p.category }}</span>
          <h3 class="project-title">{{ p.title }}</h3>
          <p class="project-desc">{{ p.description }}</p>
          <a href="#contact" class="project-link" onclick="document.querySelector('#contact').scrollIntoView({behavior:'smooth'});return false;">
            View Details <span>→</span>
          </a>
        </div>
      </div>
    </div>
  </div>
</section>
